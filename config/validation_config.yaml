# Data validation rules
validation:
  # Minimum number of rows expected
  min_rows: 100

  # Maximum allowed missing percentage per column
  max_missing_pct: 5.0

  # Required columns in raw data
  required_columns:
    - customerID
    - gender
    - SeniorCitizen
    - Partner
    - Dependents
    - tenure
    - PhoneService
    - MultipleLines
    - InternetService
    - OnlineSecurity
    - OnlineBackup
    - DeviceProtection
    - TechSupport
    - StreamingTV
    - StreamingMovies
    - Contract
    - PaperlessBilling
    - PaymentMethod
    - MonthlyCharges
    - TotalCharges
    - Churn

  # ID column (must be unique)
  id_column: "customerID"

  # Target column and allowed raw values
  target_column: "Churn"
  target_values: ["Yes", "No"]

  # Numeric columns with expected ranges (after preprocessing)
  numeric_ranges:
    tenure:
      min: 0
      max: 200
    MonthlyCharges:
      min: 0
      max: 500
    TotalCharges:
      min: 0
      max: 50000

  # Categorical columns with allowed values
  categorical_values:
    gender: ["Male", "Female"]
    Partner: ["Yes", "No"]
    Dependents: ["Yes", "No"]
    PhoneService: ["Yes", "No"]
    MultipleLines: ["Yes", "No", "No phone service"]
    InternetService: ["DSL", "Fiber optic", "No"]
    OnlineSecurity: ["Yes", "No", "No internet service"]
    OnlineBackup: ["Yes", "No", "No internet service"]
    DeviceProtection: ["Yes", "No", "No internet service"]
    TechSupport: ["Yes", "No", "No internet service"]
    StreamingTV: ["Yes", "No", "No internet service"]
    StreamingMovies: ["Yes", "No", "No internet service"]
    Contract: ["Month-to-month", "One year", "Two year"]
    PaperlessBilling: ["Yes", "No"]
    PaymentMethod:
      - "Electronic check"
      - "Mailed check"
      - "Bank transfer (automatic)"
      - "Credit card (automatic)"
