# Hyperparameter optimization configuration
hpo:
  n_trials: 50
  cv_folds: 5
  scoring: "f1"
  output_dir: "results/hpo"

# Search spaces per model (only most impactful params)
search_spaces:
  logistic_regression:
    C:
      type: "float"
      low: 0.01
      high: 10.0
      log: true
    max_iter:
      type: "int"
      low: 500
      high: 2000

  random_forest:
    n_estimators:
      type: "int"
      low: 50
      high: 300
    max_depth:
      type: "int"
      low: 3
      high: 20
    min_samples_split:
      type: "int"
      low: 2
      high: 10

  gradient_boosting:
    n_estimators:
      type: "int"
      low: 50
      high: 300
    learning_rate:
      type: "float"
      low: 0.01
      high: 0.3
      log: true
    max_depth:
      type: "int"
      low: 3
      high: 10
    subsample:
      type: "float"
      low: 0.6
      high: 1.0
