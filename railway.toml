[build]
builder = "dockerfile"

[[services]]
name = "api"
dockerfile = "docker/Dockerfile.api"

[services.deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[services]]
name = "dashboard"
dockerfile = "src/dashboard/Dockerfile"
