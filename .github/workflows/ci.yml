name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" 2>/dev/null || pip install -e .
          pip install ruff

      - name: Lint with ruff
        run: ruff check src/ scripts/ --ignore E402,F401

      - name: Run unit tests
        run: |
          cd src && PYTHONPATH=. python -m pytest tests/unit/ -v --tb=short
